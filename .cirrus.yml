task:
  name: build-ipa
  macos_instance:
    image: ghcr.io/cirruslabs/macos-sonoma-xcode:latest
  install_script:
    - brew install xcodegen || true
  generate_script:
    - xcodegen generate
  build_script:
    - xcodebuild -project MacroGen.xcodeproj -scheme MacroGen -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
  package_script:
    - mkdir -p Payload
    - cp -R build/Build/Products/Release-iphoneos/MacroGen.app Payload/
    - zip -qry MacroGen-unsigned.ipa Payload
    - ls -lh MacroGen-unsigned.ipa
  artifacts:
    path: MacroGen-unsigned.ipa
