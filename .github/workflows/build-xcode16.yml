name: build-xcode16
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: |
          ls /Applications | grep Xcode || true
          sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_16.3.app || true
          xcodebuild -version
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build IPA
        run: |
          xcodebuild -project MacroGen.xcodeproj -scheme MacroGen -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MacroGen.app Payload/
          zip -qr MacroGen-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MacroGen-ipa-xcode16
          path: MacroGen-unsigned.ipa
