name: cam-verify

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble verification sources
        run: |
          mkdir -p verify/Sources/CAMVerify
          cp Sources/True3DModel.swift verify/Sources/CAMVerify/
          cp Sources/True3DCAM.swift verify/Sources/CAMVerify/
          cp Sources/ToolpathTypes.swift verify/Sources/CAMVerify/

      - name: Fetch OCCTSwift 3.0.0 and kernel
        run: |
          rm -rf verify/OCCTSwift
          git clone --depth 1 --branch v3.0.0 https://github.com/SecondMouseAU/OCCTSwift.git verify/OCCTSwift
          mkdir -p verify/OCCTSwift/Libraries
          curl -L --retry 3 --retry-delay 3             -o /tmp/OCCT.xcframework.zip             https://github.com/SecondMouseAU/OCCTSwift/releases/download/v3.0.0/OCCT.xcframework.zip
          rm -rf /tmp/OCCTUnzip
          mkdir -p /tmp/OCCTUnzip
          unzip -q /tmp/OCCT.xcframework.zip -d /tmp/OCCTUnzip
          cp -R /tmp/OCCTUnzip/OCCT.xcframework verify/OCCTSwift/Libraries/

      - name: Run OCCT 3D CAM verification
        working-directory: verify
        env:
          CAM_DEBUG: "1"
        run: swift run -c release CAMVerify
