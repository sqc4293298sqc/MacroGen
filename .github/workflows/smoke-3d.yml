name: smoke-3d
on:
  push:
    branches: [fix3]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: List simulators
        run: xcrun simctl list devices available | head -30
      - name: Run UI smoke
        run: |
          set -o pipefail
          xcodebuild test \
            -project MacroGen.xcodeproj \
            -scheme MacroGen-3DSmoke \
            -destination 'platform=iOS Simulator,OS=26.2,name=iPhone 17' \
            -derivedDataPath build-smoke \
            CODE_SIGNING_ALLOWED=NO | tee smoke.log
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: smoke.log
