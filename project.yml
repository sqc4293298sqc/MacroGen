name: MacroGen
options:
  bundleIdPrefix: com.sqc
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  OCCTSwift:
    url: https://github.com/SecondMouseAU/OCCTSwift
    from: 3.0.0

targets:
  MacroGen:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: OCCTSwift
        product: OCCTSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sqc.macrogen
        PRODUCT_NAME: MacroGen
        MARKETING_VERSION: "2.9.37"
        CURRENT_PROJECT_VERSION: "76"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "宏程序$(MARKETING_VERSION)"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: 拍机床屏幕、程序单或零件图纸，识别成文字/尺寸后带进草图
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 从相册选程序照片或零件图纸做识别
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
