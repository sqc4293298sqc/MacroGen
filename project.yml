name: MacroGen
options:
  bundleIdPrefix: com.sqc
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  MacroGen:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sqc.macrogen
        PRODUCT_NAME: MacroGen
        MARKETING_VERSION: "2.5"
        CURRENT_PROJECT_VERSION: "14"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 宏程序
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: 拍机床屏幕或程序单，识别成文字后自动带进模拟
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 从相册选程序照片做识别
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
